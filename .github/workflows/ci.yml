name: CI

on:
  push:
    branches: [main, feat/*, fix/*, test/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          path: kovanica-playground

      - name: Checkout SDK dependency
        uses: actions/checkout@v4
        with:
          repository: KovanicaDAG/kovanica-sdk
          ref: b36d63b04af9483cce96647071f1e3de8c143231
          path: kovanica-sdk

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build SDK
        run: |
          cd kovanica-sdk
          npm ci
          npm run build

      - name: Install playground dependencies
        run: |
          cd kovanica-playground
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd kovanica-playground
          npx playwright install --with-deps chromium

      - name: Typecheck
        run: |
          cd kovanica-playground
          npm run typecheck

      - name: Lint
        run: |
          cd kovanica-playground
          npm run lint

      - name: Build Playground
        run: |
          cd kovanica-playground
          npm run build

      - name: Run Tests (Unit & Deterministic Browser Acceptance)
        run: |
          cd kovanica-playground
          npm test

      - name: Run Browser Acceptance Suite Explicitly
        run: |
          cd kovanica-playground
          npm run test:browser
